name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install wrangler 4.87.0
        run: npm install wrangler@4.87.0 --no-package-lock

      - name: Build OpenNext Cloudflare Worker
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production
          SKIP_WRANGLER_CONFIG_CHECK: "yes"
          NEXT_PUBLIC_BASE_URL: https://9router-app.oeganz1999.workers.dev
          NEXT_PUBLIC_CLOUD_URL: https://9router-app.oeganz1999.workers.dev
          BASE_URL: https://9router-app.oeganz1999.workers.dev
          CLOUD_URL: https://9router-app.oeganz1999.workers.dev

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_ENV: production
